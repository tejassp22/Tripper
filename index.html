<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tripper Route Mapper</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    :root {
      --bg: #0d0f12;
      --card: #161b22;
      --accent: #d80000;
      --accent-green: #00e676;
      --accent-blue: #2979ff;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.05rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: #21262d;
      color: var(--text-dim);
    }
    .status-badge.connected {
      background: #093c1d;
      color: var(--accent-green);
    }
    .btn-theme {
      background: #21262d;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .telemetry-row {
      display: flex;
      gap: 8px;
    }
    .telemetry-card {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .telemetry-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
    }
    .telemetry-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--accent-green);
    }
    .search-container {
      position: relative;
      width: 100%;
      display: flex;
      gap: 8px;
    }
    .search-box {
      flex: 1;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent-blue);
    }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }
    .suggestion-item {
      padding: 10px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      color: #c9d1d9;
    }
    .suggestion-item:active {
      background: #21262d;
      color: #fff;
    }
    #map {
      width: 100%;
      height: 320px;
      border-radius: 12px;
      border: 1px solid var(--border);
      z-index: 1;
      background: #1b1f24;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-instruction {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .nav-meta {
      font-size: 0.82rem;
      color: var(--text-dim);
    }
    .nav-meta b {
      color: var(--accent-green);
    }
    .row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button.secondary { background: #21262d; border: 1px solid var(--border); }
    button.start-nav {
      background: var(--accent-green);
      color: #000;
      font-size: 1rem;
    }
    button.stop-nav {
      background: #c62828;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Hunter 350 Route Mapper</h1>
    <div class="header-actions">
      <button id="btnThemeToggle" class="btn-theme" onclick="toggleTheme()">☀️ Day</button>
      <div id="statusBadge" class="status-badge">DISCONNECTED</div>
    </div>
  </header>

  <div class="telemetry-row">
    <div class="telemetry-card">
      <div class="telemetry-label">Live Speed</div>
      <div class="telemetry-value"><span id="speedVal">0</span> <small style="font-size:0.75rem; color:var(--text-dim);">km/h</small></div>
    </div>
    <div class="telemetry-card">
      <div class="telemetry-label">Display Mode</div>
      <div class="telemetry-value" id="statusVal" style="font-size: 1rem; padding-top: 4px; color: var(--accent-blue);">Idle Speedo</div>
    </div>
  </div>

  <div class="row">
    <button id="btnConnect" onclick="toggleConnection()">Connect BLE</button>
    <button class="secondary" onclick="centerOnUser()">My Location</button>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Search destination or tap map..." autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>
    <button class="secondary" style="flex: 0 0 75px;" onclick="handleManualSearch()">Search</button>
  </div>

  <div id="map"></div>

  <div class="row" id="navControlRow" style="display: none;">
    <button id="btnStartNav" class="start-nav" onclick="startNavigation()">Start Route Lines</button>
    <button class="secondary" onclick="cancelRoute()">Clear</button>
  </div>

  <div class="card">
    <div class="nav-instruction" id="turnText">Speedo Idle Mode (Ride Safe)</div>
    <div class="nav-meta">
      Next Turn: <b id="distText">-- m</b> | Remaining: <b id="remDistText">-- km</b>
    </div>
  </div>
</div>

<script>
  const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
  const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

  let bleDevice = null;
  let navCharacteristic = null;
  let currentThemeMode = 0; // 0 = Day/White, 1 = Night/Black
  let liveSpeedKmh = 0;
  let userHeading = 0;

  function toggleTheme() {
    currentThemeMode = currentThemeMode === 0 ? 1 : 0;
    document.getElementById("btnThemeToggle").textContent = currentThemeMode === 0 ? "☀️ Day" : "🌙 Night";
    evaluateNavigation(true);
  }

  async function toggleConnection() {
    if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
      return;
    }

    try {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth not found. Open this in Bluefy on iOS.");
        return;
      }

      bleDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', () => {
        document.getElementById("statusBadge").textContent = "DISCONNECTED";
        document.getElementById("statusBadge").classList.remove("connected");
        document.getElementById("btnConnect").textContent = "Connect BLE";
      });

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      navCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

      document.getElementById("statusBadge").textContent = "CONNECTED";
      document.getElementById("statusBadge").classList.add("connected");
      document.getElementById("btnConnect").textContent = "Disconnect";

      evaluateNavigation(true);
    } catch (err) {
      alert("BLE Error: " + err.message);
    }
  }

  async function writeBLE(rawString) {
    if (!navCharacteristic) return;
    try {
      const encoder = new TextEncoder();
      await navCharacteristic.writeValue(encoder.encode(rawString));
    } catch (err) {
      console.warn("BLE Write error:", err);
    }
  }

  // ===========================================================
  // MAP, SEARCH & ROUTE GEOMETRY
  // ===========================================================
  let map, userMarker, destMarker, routeLine;
  let userLat = null, userLon = null;
  let targetLat = null, targetLon = null, targetName = "Destination";

  let isNavigating = false;
  let fullRouteCoords = []; // All [lon, lat] points along the route
  let routeSteps = [];
  let currentStepIdx = 0;
  let totalTripKm = 0;
  let searchDebounce = null;

  function initMap() {
    map = L.map('map', { zoomControl: false }).setView([19.0760, 72.8777], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    map.on('click', function(e) {
      if (!userLat || !userLon) {
        alert("Waiting for GPS position lock...");
        return;
      }
      selectDestination(e.latlng.lat, e.latlng.lng, "Pinned Location");
    });

    setupSearch();
    startGpsTracking();
  }

  function setupSearch() {
    const input = document.getElementById("searchInput");
    const list = document.getElementById("suggestions");

    input.addEventListener("input", () => {
      clearTimeout(searchDebounce);
      const query = input.value.trim();
      if (query.length < 3) {
        list.style.display = "none";
        return;
      }

      searchDebounce = setTimeout(async () => {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
          const res = await fetch(url);
          const data = await res.json();
          renderSuggestions(data);
        } catch (e) {
          console.error("Search error:", e);
        }
      }, 400);
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest('.search-container')) {
        list.style.display = "none";
      }
    });
  }

  function renderSuggestions(items) {
    const list = document.getElementById("suggestions");
    list.innerHTML = "";
    if (!items || items.length === 0) {
      list.style.display = "none";
      return;
    }

    items.forEach(item => {
      const div = document.createElement("div");
      div.className = "suggestion-item";
      div.textContent = item.display_name;
      div.onclick = () => {
        document.getElementById("searchInput").value = item.display_name.split(',')[0];
        list.style.display = "none";
        selectDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',')[0]);
      };
      list.appendChild(div);
    });

    list.style.display = "block";
  }

  function handleManualSearch() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) return;
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`)
      .then(r => r.json())
      .then(data => {
        if (data && data.length > 0) {
          selectDestination(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name.split(',')[0]);
        } else {
          alert("Location not found.");
        }
      });
  }

  async function selectDestination(lat, lon, label) {
    targetLat = lat;
    targetLon = lon;
    targetName = label;

    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.marker([lat, lon]).addTo(map).bindPopup(label).openPopup();

    document.getElementById("turnText").textContent = "Calculating route...";

    const url = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${lon},${lat}?overview=full&geometries=geojson&steps=true`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (!data.routes || data.routes.length === 0) {
        alert("No drivable route found!");
        return;
      }

      const route = data.routes[0];
      totalTripKm = (route.distance / 1000.0).toFixed(1);
      fullRouteCoords = route.geometry.coordinates; // [[lon, lat], ...]
      routeSteps = route.legs[0].steps;
      currentStepIdx = 0;

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.geoJSON(route.geometry, {
        style: { color: '#00e676', weight: 6, opacity: 0.9 }
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

      document.getElementById("navControlRow").style.display = "flex";
      document.getElementById("turnText").textContent = `Route Ready (${totalTripKm} km)`;
      document.getElementById("remDistText").textContent = `${totalTripKm} km`;
    } catch (err) {
      alert("Routing error: " + err.message);
    }
  }

  function startNavigation() {
    isNavigating = true;
    const btn = document.getElementById("btnStartNav");
    btn.textContent = "Stop Route Lines";
    btn.className = "stop-nav";
    btn.onclick = stopNavigation;
    document.getElementById("statusVal").textContent = "Route Lines Active";
    document.getElementById("statusVal").style.color = "var(--accent-green)";

    centerOnUser();
    evaluateNavigation();
  }

  function stopNavigation() {
    isNavigating = false;
    const btn = document.getElementById("btnStartNav");
    btn.textContent = "Start Route Lines";
    btn.className = "start-nav";
    btn.onclick = startNavigation;
    document.getElementById("statusVal").textContent = "Idle Speedo";
    document.getElementById("statusVal").style.color = "var(--accent-blue)";
    document.getElementById("turnText").textContent = "Speedo Idle Mode (Ride Safe)";
    
    evaluateNavigation(true);
  }

  function cancelRoute() {
    stopNavigation();
    if (destMarker) map.removeLayer(destMarker);
    if (routeLine) map.removeLayer(routeLine);
    fullRouteCoords = [];
    routeSteps = [];
    document.getElementById("navControlRow").style.display = "none";
    document.getElementById("distText").textContent = "-- m";
    document.getElementById("remDistText").textContent = "-- km";
  }

  function startGpsTracking() {
    if (!navigator.geolocation) return;

    let lastLat = null, lastLon = null;

    navigator.geolocation.watchPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        
        const rawSpeed = pos.coords.speed;
        liveSpeedKmh = (rawSpeed && rawSpeed > 0.5) ? Math.round(rawSpeed * 3.6) : 0;
        document.getElementById("speedVal").textContent = liveSpeedKmh;

        // Estimate heading if compass heading is not available
        if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
          userHeading = pos.coords.heading;
        } else if (lastLat !== null && lastLon !== null) {
          const d = getDistanceMeters(lastLat, lastLon, userLat, userLon);
          if (d > 2) {
            userHeading = calculateBearing(lastLat, lastLon, userLat, userLon);
          }
        }
        lastLat = userLat;
        lastLon = userLon;

        if (!userMarker) {
          userMarker = L.circleMarker([userLat, userLon], {
            radius: 8,
            fillColor: "#2979ff",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 1.0
          }).addTo(map);
          map.setView([userLat, userLon], 15);
        } else {
          userMarker.setLatLng([userLat, userLon]);
        }

        if (isNavigating) {
          map.setView([userLat, userLon]);
          evaluateNavigation();
        } else {
          evaluateNavigation(true);
        }
      },
      (err) => console.warn(err),
      { enableHighAccuracy: true, maximumAge: 1000 }
    );
  }

  function centerOnUser() {
    if (userLat && userLon && map) {
      map.setView([userLat, userLon], 16);
    }
  }

  // ===========================================================
  // VECTOR ROUTE PROJECTION ENGINE
  // Projects upcoming world GPS coordinates relative to bike heading
  // into 240x240 screen coordinates centered at (120, 145)
  // ===========================================================
  function getProjectedRoutePoints(maxPoints = 8) {
    if (!fullRouteCoords || fullRouteCoords.length === 0 || !userLat || !userLon) return [];

    // 1. Find closest coordinate index on route
    let closestIdx = 0;
    let minDist = Infinity;
    for (let i = 0; i < fullRouteCoords.length; i++) {
      const d = getDistanceMeters(userLat, userLon, fullRouteCoords[i][1], fullRouteCoords[i][0]);
      if (d < minDist) {
        minDist = d;
        closestIdx = i;
      }
    }

    const points = [];
    // Start at bike position on display (120, 145)
    points.push({ x: 120, y: 145 });

    // Look ahead 250 meters along the route
    const LOOKAHEAD_METERS = 250.0;
    const PIXEL_SCALE = 70.0 / LOOKAHEAD_METERS; // 70px vertical reach on screen

    const radH = (userHeading * Math.PI) / 180.0;
    const cosH = Math.cos(radH);
    const sinH = Math.sin(radH);

    for (let i = closestIdx + 1; i < fullRouteCoords.length && points.length < maxPoints; i++) {
      const ptLon = fullRouteCoords[i][0];
      const ptLat = fullRouteCoords[i][1];

      // Local flat-earth offsets in meters from user
      const dY = (ptLat - userLat) * 111139.0;
      const dX = (ptLon - userLon) * 111139.0 * Math.cos((userLat * Math.PI) / 180.0);

      // Rotate offsets so userHeading points straight UP (-Y)
      const forwardMeters = dX * sinH + dY * cosH;
      const rightMeters   = dX * cosH - dY * sinH;

      const screenX = Math.round(120 + rightMeters * PIXEL_SCALE);
      const screenY = Math.round(145 - forwardMeters * PIXEL_SCALE);

      // Only push points with meaningful separation
      const prev = points[points.length - 1];
      if (Math.hypot(screenX - prev.x, screenY - prev.y) > 6) {
        points.push({ x: screenX, y: screenY });
      }
    }

    return points;
  }

  function evaluateNavigation(forcePush = false) {
    const now = new Date();

    if (!isNavigating) {
      if (forcePush && navCharacteristic) {
        const payload = `SPD,${liveSpeedKmh},${now.getHours()},${now.getMinutes()},${currentThemeMode}\n`;
        writeBLE(payload);
      }
      return;
    }

    if (!routeSteps || routeSteps.length === 0 || currentStepIdx >= routeSteps.length) return;

    const step = routeSteps[currentStepIdx];
    const stepTargetCoord = step.maneuver.location;
    const distMeters = Math.round(getDistanceMeters(userLat, userLon, stepTargetCoord[1], stepTargetCoord[0]));

    if (distMeters < 25 && currentStepIdx < routeSteps.length - 1) {
      currentStepIdx++;
    }

    const activeStep = routeSteps[currentStepIdx];
    let cleanRoad = (activeStep.name || targetName || "Road").split(',')[0].trim();
    if (cleanRoad.length > 18) cleanRoad = cleanRoad.substring(0, 18);

    let remDistMeters = distMeters;
    for (let i = currentStepIdx + 1; i < routeSteps.length; i++) {
      remDistMeters += routeSteps[i].distance;
    }
    const remKm = (remDistMeters / 1000.0).toFixed(1);

    document.getElementById("turnText").textContent = activeStep.maneuver.instruction || cleanRoad;
    document.getElementById("distText").textContent = `${distMeters} m`;
    document.getElementById("remDistText").textContent = `${remKm} km`;

    // Generate upcoming road polyline points
    const pts = getProjectedRoutePoints(8);
    let ptsPayload = `${pts.length}`;
    pts.forEach(p => {
      ptsPayload += `,${p.x},${p.y}`;
    });

    // PATH Protocol: PATH,<Dist>,<Speed>,<Theme>,<Count>,x0,y0,x1,y1...<Road>
    const payload = `PATH,${distMeters},${liveSpeedKmh},${currentThemeMode},${ptsPayload},${cleanRoad}\n`;
    writeBLE(payload);
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function calculateBearing(lat1, lon1, lat2, lon2) {
    const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
              Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
    return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
  }

  window.addEventListener('load', () => {
    initMap();
  });
</script>

</body>
</html>
