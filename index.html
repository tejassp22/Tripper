<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tripper Navigator Pro</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    :root {
      --bg: #0d0f12;
      --card: #161b22;
      --accent: #d80000;
      --accent-green: #00e676;
      --accent-blue: #2979ff;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.05rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: #21262d;
      color: var(--text-dim);
    }
    .status-badge.connected {
      background: #093c1d;
      color: var(--accent-green);
    }
    .btn-theme {
      background: #21262d;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .tele-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tele-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 700;
    }
    .tele-val {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-green);
      margin-top: 2px;
    }

    .control-strip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }
    .limit-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .limit-input {
      width: 52px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #ff9800;
      font-weight: 700;
      text-align: center;
      padding: 4px;
      outline: none;
    }
    .btn-reset-odo {
      background: #30363d;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .search-container {
      position: relative;
      width: 100%;
      display: flex;
      gap: 8px;
    }
    .search-box {
      flex: 1;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent-blue);
    }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }
    .suggestion-item {
      padding: 10px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      color: #c9d1d9;
    }
    .suggestion-item:active {
      background: #21262d;
      color: #fff;
    }
    #map {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      border: 1px solid var(--border);
      z-index: 1;
      background: #1b1f24;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-instruction {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .nav-meta {
      font-size: 0.82rem;
      color: var(--text-dim);
    }
    .nav-meta b {
      color: var(--accent-green);
    }
    .row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button.secondary { background: #21262d; border: 1px solid var(--border); }
    button.start-nav {
      background: var(--accent-green);
      color: #000;
      font-size: 1rem;
    }
    button.stop-nav {
      background: #c62828;
    }
    button.gpx-btn {
      background: #ff9800;
      color: #000;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Hunter 350 Navigator</h1>
    <div class="header-actions">
      <button id="btnThemeToggle" class="btn-theme" onclick="toggleTheme()">☀️ Day</button>
      <div id="statusBadge" class="status-badge">DISCONNECTED</div>
    </div>
  </header>

  <!-- Telemetry Dashboard -->
  <div class="telemetry-grid">
    <div class="tele-box">
      <div class="tele-label">Speed</div>
      <div class="tele-val"><span id="speedVal">0</span> <small style="font-size:0.6rem">km/h</small></div>
    </div>
    <div class="tele-box">
      <div class="tele-label">Top Spd</div>
      <div class="tele-val"><span id="topSpeedVal">0</span></div>
    </div>
    <div class="tele-box">
      <div class="tele-label">Avg Spd</div>
      <div class="tele-val"><span id="avgSpeedVal">0</span></div>
    </div>
    <div class="tele-box">
      <div class="tele-label">Trip Time</div>
      <div class="tele-val" id="tripTimeVal" style="color:var(--text)">00:00</div>
    </div>
  </div>

  <!-- Overspeed Limit, Odometer Reset & Weather Strip -->
  <div class="control-strip">
    <div class="limit-control">
      <span>Limit:</span>
      <input type="number" id="speedLimitInput" class="limit-input" value="60" min="20" max="140" onchange="updateLimit()">
      <span>km/h</span>
    </div>
    <button class="btn-reset-odo" onclick="resetTripOdo()">Reset Trip A</button>
    <div>Weather: <b id="weatherTemp">--</b>°C</div>
  </div>

  <div class="row">
    <button id="btnConnect" onclick="toggleConnection()">Connect BLE</button>
    <button class="secondary" onclick="centerOnUser()">My Location</button>
  </div>

  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Search destination or tap map..." autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>
    <button class="secondary" style="flex: 0 0 75px;" onclick="handleManualSearch()">Search</button>
  </div>

  <div id="map"></div>

  <div class="row" id="navControlRow" style="display: none;">
    <button id="btnStartNav" class="start-nav" onclick="startNavigation()">Start Navigation</button>
    <button class="secondary" onclick="cancelRoute()">Clear</button>
  </div>

  <div class="row" id="gpxRow" style="display: none;">
    <button class="gpx-btn" onclick="exportGPX()">Download GPX Route</button>
  </div>

  <div class="card">
    <div class="nav-instruction" id="turnText">Speedo & ODO Rotation Active</div>
    <div class="nav-meta">
      Next Turn: <b id="distText">-- m</b> | Remaining: <b id="remDistText">-- km</b>
    </div>
  </div>
</div>

<script>
  // ===========================================================
  // 1. BLUETOOTH & STATE ENGINE
  // ===========================================================
  const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
  const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

  let bleDevice = null;
  let navCharacteristic = null;
  let currentThemeMode = 0;
  let speedLimitKmh = 60;

  function updateLimit() {
    const val = parseInt(document.getElementById("speedLimitInput").value);
    if (!isNaN(val) && val > 0) {
      speedLimitKmh = val;
      evaluateNavigation(true);
    }
  }

  function resetTripOdo() {
    if (confirm("Reset Trip A Odometer to 0.0 km?")) {
      writeBLE("RST,TRIP\n");
    }
  }

  function toggleTheme() {
    currentThemeMode = currentThemeMode === 0 ? 1 : 0;
    document.getElementById("btnThemeToggle").textContent = currentThemeMode === 0 ? "☀️ Day" : "🌙 Night";
    evaluateNavigation(true);
  }

  async function toggleConnection() {
    if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
      return;
    }

    try {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth not found. Open in Bluefy on iOS.");
        return;
      }

      bleDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', () => {
        document.getElementById("statusBadge").textContent = "DISCONNECTED";
        document.getElementById("statusBadge").classList.remove("connected");
        document.getElementById("btnConnect").textContent = "Connect BLE";
      });

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      navCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

      document.getElementById("statusBadge").textContent = "CONNECTED";
      document.getElementById("statusBadge").classList.add("connected");
      document.getElementById("btnConnect").textContent = "Disconnect";

      evaluateNavigation(true);
    } catch (err) {
      alert("BLE Error: " + err.message);
    }
  }

  async function writeBLE(rawString) {
    if (!navCharacteristic) return;
    try {
      const encoder = new TextEncoder();
      await navCharacteristic.writeValue(encoder.encode(rawString));
    } catch (err) {
      console.warn("BLE Write error:", err);
    }
  }

  // ===========================================================
  // 2. LIVE WEATHER & RAIN CHECK (Open-Meteo)
  // ===========================================================
  let ambientTemp = 28;
  let rainActive = 0;
  let lastWeatherCheck = 0;

  async function fetchLiveWeather(lat, lon) {
    const now = Date.now();
    if (now - lastWeatherCheck < 240000) return;
    lastWeatherCheck = now;

    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&hourly=precipitation_probability&forecast_days=1`;
      const res = await fetch(url);
      const data = await res.json();

      if (data && data.current) {
        ambientTemp = Math.round(data.current.temperature_2m);
        document.getElementById("weatherTemp").textContent = ambientTemp;

        const code = data.current.weather_code;
        const currentRain = data.current.precipitation > 0.1 || (code >= 51 && code <= 67) || (code >= 80 && code <= 99);
        const hourIdx = new Date().getHours();
        const rainProb = (data.hourly && data.hourly.precipitation_probability) ? data.hourly.precipitation_probability[hourIdx] : 0;

        rainActive = (currentRain || rainProb >= 40) ? 1 : 0;
      }
    } catch (e) {
      console.warn("Weather fetch error", e);
    }
  }

  // ===========================================================
  // 3. TRIP TELEMETRY & GPX RECORDER
  // ===========================================================
  let liveSpeedKmh = 0;
  let topSpeedKmh = 0;
  let speedSum = 0;
  let speedSamples = 0;
  let tripStartTime = null;
  let recordedGpxTrack = [];

  function updateTelemetry(speed) {
    liveSpeedKmh = speed;
    document.getElementById("speedVal").textContent = liveSpeedKmh;

    if (isNavigating) {
      if (liveSpeedKmh > topSpeedKmh) {
        topSpeedKmh = liveSpeedKmh;
        document.getElementById("topSpeedVal").textContent = topSpeedKmh;
      }
      speedSum += liveSpeedKmh;
      speedSamples++;
      const avg = Math.round(speedSum / speedSamples);
      document.getElementById("avgSpeedVal").textContent = avg;

      if (tripStartTime) {
        const elapsedSec = Math.floor((Date.now() - tripStartTime) / 1000);
        const mm = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const ss = String(elapsedSec % 60).padStart(2, '0');
        document.getElementById("tripTimeVal").textContent = `${mm}:${ss}`;
      }
    }
  }

  function exportGPX() {
    if (recordedGpxTrack.length === 0) {
      alert("No recorded ride points available!");
      return;
    }

    let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Tripper-Hunter350">\n<trk>\n<name>Hunter 350 Ride - ${new Date().toLocaleDateString()}</name>\n<trkseg>\n`;
    recordedGpxTrack.forEach(pt => {
      gpx += `  <trkpt lat="${pt.lat}" lon="${pt.lon}"><time>${pt.time}</time><extensions><speed>${pt.speed}</speed></extensions></trkpt>\n`;
    });
    gpx += `</trkseg>\n</trk>\n</gpx>`;

    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Ride_${Date.now()}.gpx`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ===========================================================
  // 4. MAP, SEARCH & NAVIGATION ENGINE
  // ===========================================================
  let map, userMarker, destMarker, routeLine;
  let userLat = null, userLon = null;
  let targetLat = null, targetLon = null, targetName = "Destination";

  let isNavigating = false;
  let routeSteps = [];
  let currentStepIdx = 0;
  let totalTripKm = 0;
  let searchDebounce = null;

  function initMap() {
    map = L.map('map', { zoomControl: false }).setView([19.0760, 72.8777], 13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    map.on('click', function(e) {
      if (!userLat || !userLon) {
        alert("Waiting for GPS position lock...");
        return;
      }
      selectDestination(e.latlng.lat, e.latlng.lng, "Pinned Location");
    });

    setupSearch();
    startGpsTracking();
  }

  function setupSearch() {
    const input = document.getElementById("searchInput");
    const list = document.getElementById("suggestions");

    input.addEventListener("input", () => {
      clearTimeout(searchDebounce);
      const query = input.value.trim();
      if (query.length < 3) {
        list.style.display = "none";
        return;
      }

      searchDebounce = setTimeout(async () => {
        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
          const res = await fetch(url);
          const data = await res.json();
          renderSuggestions(data);
        } catch (e) {
          console.error("Search error:", e);
        }
      }, 400);
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest('.search-container')) {
        list.style.display = "none";
      }
    });
  }

  function renderSuggestions(items) {
    const list = document.getElementById("suggestions");
    list.innerHTML = "";
    if (!items || items.length === 0) {
      list.style.display = "none";
      return;
    }

    items.forEach(item => {
      const div = document.createElement("div");
      div.className = "suggestion-item";
      div.textContent = item.display_name;
      div.onclick = () => {
        document.getElementById("searchInput").value = item.display_name.split(',')[0];
        list.style.display = "none";
        selectDestination(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',')[0]);
      };
      list.appendChild(div);
    });

    list.style.display = "block";
  }

  function handleManualSearch() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) return;
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`)
      .then(r => r.json())
      .then(data => {
        if (data && data.length > 0) {
          selectDestination(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name.split(',')[0]);
        } else {
          alert("Location not found.");
        }
      });
  }

  async function selectDestination(lat, lon, label) {
    targetLat = lat;
    targetLon = lon;
    targetName = label;

    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.marker([lat, lon]).addTo(map).bindPopup(label).openPopup();

    document.getElementById("turnText").textContent = "Calculating route...";

    const url = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${lon},${lat}?overview=full&geometries=geojson&steps=true`;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (!data.routes || data.routes.length === 0) {
        alert("No drivable route found!");
        return;
      }

      const route = data.routes[0];
      totalTripKm = (route.distance / 1000.0).toFixed(1);
      routeSteps = route.legs[0].steps;
      currentStepIdx = 0;

      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.geoJSON(route.geometry, {
        style: { color: '#00e676', weight: 6, opacity: 0.9 }
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

      document.getElementById("navControlRow").style.display = "flex";
      document.getElementById("turnText").textContent = `Route Ready (${totalTripKm} km)`;
      document.getElementById("remDistText").textContent = `${totalTripKm} km`;
    } catch (err) {
      alert("Routing error: " + err.message);
    }
  }

  function startNavigation() {
    isNavigating = true;
    tripStartTime = Date.now();
    recordedGpxTrack = [];
    topSpeedKmh = 0;
    speedSum = 0;
    speedSamples = 0;

    const btn = document.getElementById("btnStartNav");
    btn.textContent = "Stop Navigation";
    btn.className = "stop-nav";
    btn.onclick = stopNavigation;
    document.getElementById("gpxRow").style.display = "none";

    centerOnUser();
    evaluateNavigation();
  }

  function stopNavigation() {
    isNavigating = false;
    const btn = document.getElementById("btnStartNav");
    btn.textContent = "Start Navigation";
    btn.className = "start-nav";
    btn.onclick = startNavigation;
    document.getElementById("turnText").textContent = "Speedo & ODO Rotation Active";

    document.getElementById("gpxRow").style.display = "flex";

    const durationMin = tripStartTime ? Math.max(1, Math.round((Date.now() - tripStartTime) / 60000)) : 1;
    const avg = speedSamples > 0 ? Math.round(speedSum / speedSamples) : 0;
    const sumPacket = `SUM,${totalTripKm},${durationMin},${topSpeedKmh},${avg},${ambientTemp}\n`;
    writeBLE(sumPacket);
  }

  function cancelRoute() {
    stopNavigation();
    if (destMarker) map.removeLayer(destMarker);
    if (routeLine) map.removeLayer(routeLine);
    routeSteps = [];
    document.getElementById("navControlRow").style.display = "none";
    document.getElementById("distText").textContent = "-- m";
    document.getElementById("remDistText").textContent = "-- km";
  }

  let lastGpsLat = null;
  let lastGpsLon = null;
  let lastGpsTime = null;

  function startGpsTracking() {
    if (!navigator.geolocation) return;

    navigator.geolocation.watchPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        const currentTime = Date.now();
        
        let calculatedSpeed = 0;
        const rawSpeed = pos.coords.speed;

        if (rawSpeed !== null && !isNaN(rawSpeed) && rawSpeed > 0.2) {
          calculatedSpeed = Math.round(rawSpeed * 3.6);
        } else if (lastGpsLat !== null && lastGpsLon !== null && lastGpsTime !== null) {
          const timeDeltaSec = (currentTime - lastGpsTime) / 1000.0;
          if (timeDeltaSec >= 0.8) {
            const distM = getDistanceMeters(lastGpsLat, lastGpsLon, userLat, userLon);
            if (distM >= 1.2) {
              calculatedSpeed = Math.round((distM / timeDeltaSec) * 3.6);
              // Send distance delta to hardware odometer
              writeBLE(`ODO,${distM.toFixed(1)}\n`);
            }
          }
        }

        if (lastGpsLat === null || (currentTime - lastGpsTime) >= 800) {
          lastGpsLat = userLat;
          lastGpsLon = userLon;
          lastGpsTime = currentTime;
        }

        updateTelemetry(calculatedSpeed);

        if (isNavigating) {
          recordedGpxTrack.push({
            lat: userLat,
            lon: userLon,
            time: new Date().toISOString(),
            speed: calculatedSpeed
          });
        }

        fetchLiveWeather(userLat, userLon);

        if (!userMarker) {
          userMarker = L.circleMarker([userLat, userLon], {
            radius: 8,
            fillColor: "#2979ff",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 1.0
          }).addTo(map);
          map.setView([userLat, userLon], 15);
        } else {
          userMarker.setLatLng([userLat, userLon]);
        }

        if (isNavigating) {
          map.setView([userLat, userLon]);
          evaluateNavigation();
        } else {
          evaluateNavigation(true);
        }
      },
      (err) => console.warn(err),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
    );
  }

  function centerOnUser() {
    if (userLat && userLon && map) {
      map.setView([userLat, userLon], 16);
    }
  }

  function mapManeuverToTripper(maneuver) {
    const type = maneuver.type;
    const modifier = maneuver.modifier || "";

    if (type.includes("roundabout") || type.includes("rotary")) return 4;
    if (modifier.includes("left")) return 1;
    if (modifier.includes("right")) return 2;
    if (modifier.includes("u-turn")) return 3;
    return 0;
  }

  function evaluateNavigation(forcePush = false) {
    const now = new Date();

    if (!isNavigating) {
      if (forcePush && navCharacteristic) {
        const payload = `SPD,${liveSpeedKmh},${speedLimitKmh},${now.getHours()},${now.getMinutes()},${currentThemeMode},${ambientTemp},${rainActive}\n`;
        writeBLE(payload);
      }
      return;
    }

    if (!routeSteps || routeSteps.length === 0 || currentStepIdx >= routeSteps.length) return;

    const step = routeSteps[currentStepIdx];
    const stepTargetCoord = step.maneuver.location;
    const distMeters = Math.round(getDistanceMeters(userLat, userLon, stepTargetCoord[1], stepTargetCoord[0]));

    if (distMeters < 25 && currentStepIdx < routeSteps.length - 1) {
      currentStepIdx++;
    }

    const activeStep = routeSteps[currentStepIdx];
    const turnType = mapManeuverToTripper(activeStep.maneuver);
    
    let cleanRoad = (activeStep.name || targetName || "Road").split(',')[0].trim();
    if (cleanRoad.length > 18) cleanRoad = cleanRoad.substring(0, 18);

    const initDist = Math.round(activeStep.distance) || distMeters;

    let remDistMeters = distMeters;
    for (let i = currentStepIdx + 1; i < routeSteps.length; i++) {
      remDistMeters += routeSteps[i].distance;
    }
    const remKm = (remDistMeters / 1000.0).toFixed(1);

    document.getElementById("turnText").textContent = activeStep.maneuver.instruction || cleanRoad;
    document.getElementById("distText").textContent = `${distMeters} m`;
    document.getElementById("remDistText").textContent = `${remKm} km`;

    const payload = `NAV,${turnType},${distMeters},${initDist},${remKm},${totalTripKm},${now.getHours()},${now.getMinutes()},${currentThemeMode},${liveSpeedKmh},${speedLimitKmh},${ambientTemp},${rainActive},${cleanRoad}\n`;
    writeBLE(payload);
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  window.addEventListener('load', () => {
    initMap();
  });
</script>
