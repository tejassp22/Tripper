<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tripper BLE Controller & Simulator</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #d80000;
      --accent-blue: #007aff;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #2d2d2d;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 4px 0;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status-badge {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      background: #2a2a2a;
      color: var(--text-dim);
      align-self: center;
    }
    .status-badge.connected {
      background: #004d20;
      color: #00e676;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row > div {
      flex: 1;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.15s;
    }
    button:active {
      opacity: 0.8;
    }
    button.secondary {
      background: #2a2a2a;
      border: 1px solid var(--border);
    }
    button.sim-active {
      background: #c67d00;
    }
    .preview-box {
      font-family: monospace;
      font-size: 0.75rem;
      background: #000;
      border-radius: 6px;
      padding: 8px;
      color: #00e676;
      word-break: break-all;
    }
    .sim-info {
      font-size: 0.82rem;
      color: var(--text-dim);
      line-height: 1.4;
      background: #151515;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
    }
    .sim-info b {
      color: #fff;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Tripper Controller</h1>
  <div id="statusBadge" class="status-badge">DISCONNECTED</div>

  <button id="btnConnect" onclick="toggleConnection()">Connect to Tripper</button>

  <!-- AUTO SIMULATION CARD -->
  <div class="card">
    <div class="card-title">Auto Ride Simulator</div>
    <div class="sim-info" id="simStatusText">
      Status: <b>Idle</b><br>
      Step: <b id="simStepName">-</b> | Dist to Turn: <b id="simDist">-</b>
    </div>

    <div class="row">
      <div>
        <label for="simSpeed">Sim Speed</label>
        <select id="simSpeed">
          <option value="1">1x (Cruising ~40 km/h)</option>
          <option value="2" selected>2x (Fast ~80 km/h)</option>
          <option value="4">4x (Hyper ~160 km/h)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <button id="btnStartSim" onclick="toggleSimulation()">Start Simulation</button>
      <button class="secondary" onclick="resetSimulation()">Reset</button>
    </div>
  </div>

  <!-- MANUAL OVERRIDE CARD -->
  <div class="card">
    <div class="card-title">Manual Controls</div>
    <div>
      <label for="turnSelect">Maneuver Type</label>
      <select id="turnSelect" onchange="updatePreview()">
        <option value="0">Straight (0)</option>
        <option value="1" selected>Turn Left (1)</option>
        <option value="2">Turn Right (2)</option>
        <option value="3">U-Turn (3)</option>
        <option value="4">Roundabout (4)</option>
      </select>
    </div>

    <div class="row">
      <div>
        <label for="stepDist">Turn Dist (m)</label>
        <input type="number" id="stepDist" value="450" oninput="updatePreview()">
      </div>
      <div>
        <label for="stepInitDist">Initial Dist (m)</label>
        <input type="number" id="stepInitDist" value="500" oninput="updatePreview()">
      </div>
    </div>

    <div>
      <label for="roadName">Road Name</label>
      <input type="text" id="roadName" value="MG Road" maxlength="28" oninput="updatePreview()">
    </div>

    <div class="row">
      <div>
        <label for="remDist">Remaining (km)</label>
        <input type="number" step="0.1" id="remDist" value="7.5" oninput="updatePreview()">
      </div>
      <div>
        <label for="totalDist">Total (km)</label>
        <input type="number" step="0.1" id="totalDist" value="10.0" oninput="updatePreview()">
      </div>
    </div>

    <button onclick="sendManualPacket()">Send Manual Update</button>
  </div>

  <!-- PACKET PREVIEW -->
  <div class="card">
    <label>Live Packet Stream</label>
    <div id="preview" class="preview-box">NAV,...</div>
  </div>
</div>

<script>
  const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
  const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

  let bleDevice = null;
  let navCharacteristic = null;

  // -----------------------------------------------------------
  // Simulated Route Data
  // -----------------------------------------------------------
  const SIM_ROUTE = [
    { turn: 0, distance: 800,  road: "Main Highway" },
    { turn: 1, distance: 450,  road: "Church Street" },
    { turn: 2, distance: 600,  road: "Residency Road" },
    { turn: 4, distance: 500,  road: "Ring Roundabout" },
    { turn: 3, distance: 350,  road: "U-Turn Airport Expy" },
    { turn: 0, distance: 1200, road: "Destination Way" }
  ];

  const TOTAL_SIM_TRIP_KM = 8.5;
  let simIndex = 0;
  let simCurrentStepDist = 0;
  let simStepInitialDist = 0;
  let simRemainingTripKm = TOTAL_SIM_TRIP_KM;
  let simInterval = null;

  function updateStatus(connected) {
    const badge = document.getElementById("statusBadge");
    const btn = document.getElementById("btnConnect");
    if (connected) {
      badge.textContent = "CONNECTED: " + (bleDevice.name || "Tripper");
      badge.classList.add("connected");
      btn.textContent = "Disconnect";
      btn.classList.add("secondary");
    } else {
      badge.textContent = "DISCONNECTED";
      badge.classList.remove("connected");
      btn.textContent = "Connect to Tripper";
      btn.classList.remove("secondary");
      stopSimulation();
    }
  }

  function buildPayload(turn, stepDist, initDist, remDist, totDist, road) {
    const now = new Date();
    const hr = now.getHours();
    const min = now.getMinutes();
    return `NAV,${turn},${stepDist},${initDist},${remDist},${totDist},${hr},${min},${road}\n`;
  }

  function updatePreview() {
    const payload = buildPayload(
      document.getElementById("turnSelect").value,
      document.getElementById("stepDist").value || "0",
      document.getElementById("stepInitDist").value || "0",
      document.getElementById("remDist").value || "0.0",
      document.getElementById("totalDist").value || "0.0",
      document.getElementById("roadName").value || "Road"
    );
    document.getElementById("preview").textContent = payload.trim();
  }

  // -----------------------------------------------------------
  // Bluetooth Connection Handling
  // -----------------------------------------------------------
  async function toggleConnection() {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
      return;
    }

    try {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth not found. Open this page in 'Bluefy' on iOS or Chrome/Edge on laptop.");
        return;
      }

      bleDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', () => updateStatus(false));

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      navCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

      updateStatus(true);
      sendManualPacket();
    } catch (err) {
      console.error(err);
      alert("BLE Error: " + err.message);
      updateStatus(false);
    }
  }

  async function writeBLE(rawString) {
    if (!navCharacteristic) return;
    try {
      const encoder = new TextEncoder();
      await navCharacteristic.writeValue(encoder.encode(rawString));
      document.getElementById("preview").textContent = rawString.trim();
    } catch (err) {
      console.error("BLE Write error:", err);
    }
  }

  function sendManualPacket() {
    if (!navCharacteristic) {
      alert("Please connect to Tripper first!");
      return;
    }
    stopSimulation();
    const payload = buildPayload(
      document.getElementById("turnSelect").value,
      document.getElementById("stepDist").value,
      document.getElementById("stepInitDist").value,
      document.getElementById("remDist").value,
      document.getElementById("totalDist").value,
      document.getElementById("roadName").value
    );
    writeBLE(payload);
  }

  // -----------------------------------------------------------
  // Simulation Engine
  // -----------------------------------------------------------
  function initSimStep() {
    const leg = SIM_ROUTE[simIndex];
    simCurrentStepDist = leg.distance;
    simStepInitialDist = leg.distance;
    updateSimDisplay();
  }

  function updateSimDisplay() {
    const leg = SIM_ROUTE[simIndex];
    document.getElementById("simStepName").textContent = `${leg.road} (Step ${simIndex + 1}/${SIM_ROUTE.length})`;
    document.getElementById("simDist").textContent = `${simCurrentStepDist} m`;
  }

  function toggleSimulation() {
    if (!navCharacteristic) {
      alert("Please connect to Tripper via Bluetooth first!");
      return;
    }

    if (simInterval) {
      stopSimulation();
    } else {
      startSimulation();
    }
  }

  function startSimulation() {
    const btn = document.getElementById("btnStartSim");
    btn.textContent = "Pause Simulation";
    btn.classList.add("sim-active");
    document.getElementById("simStatusText").querySelector("b").textContent = "Running";

    if (simCurrentStepDist === 0) {
      initSimStep();
    }

    simInterval = setInterval(simulationTick, 1000);
  }

  function stopSimulation() {
    if (simInterval) {
      clearInterval(simInterval);
      simInterval = null;
    }
    const btn = document.getElementById("btnStartSim");
    btn.textContent = "Resume Simulation";
    btn.classList.remove("sim-active");
    const bTag = document.getElementById("simStatusText").querySelector("b");
    if (bTag) bTag.textContent = "Paused";
  }

  function resetSimulation() {
    stopSimulation();
    simIndex = 0;
    simRemainingTripKm = TOTAL_SIM_TRIP_KM;
    initSimStep();
    const btn = document.getElementById("btnStartSim");
    btn.textContent = "Start Simulation";
    document.getElementById("simStatusText").querySelector("b").textContent = "Idle";
  }

  function simulationTick() {
    const speedMultiplier = parseInt(document.getElementById("simSpeed").value, 10);
    // Base decrement: 15 meters per second at 1x (~54 km/h)
    const decrement = 15 * speedMultiplier;

    simCurrentStepDist -= decrement;
    simRemainingTripKm -= (decrement / 1000.0);
    if (simRemainingTripKm < 0) simRemainingTripKm = 0;

    if (simCurrentStepDist <= 0) {
      // Advance to next leg
      simIndex = (simIndex + 1) % SIM_ROUTE.length;
      initSimStep();
    }

    const currentLeg = SIM_ROUTE[simIndex];
    updateSimDisplay();

    // Construct packet and push via BLE
    const payload = buildPayload(
      currentLeg.turn,
      Math.max(0, simCurrentStepDist),
      simStepInitialDist,
      simRemainingTripKm.toFixed(1),
      TOTAL_SIM_TRIP_KM.toFixed(1),
      currentLeg.road
    );

    writeBLE(payload);
  }

  // Init default state
  initSimStep();
  updatePreview();
</script>

</body>
</html>
