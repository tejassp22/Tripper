<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tripper Navigator</title>

  <!-- Leaflet CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #0d0f12;
      --card: #161b22;
      --accent: #d80000;
      --accent-green: #00e676;
      --accent-blue: #2979ff;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #30363d;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 12px;
      background: #21262d;
      color: var(--text-dim);
    }
    .status-badge.connected {
      background: #093c1d;
      color: var(--accent-green);
    }

    /* Search Bar */
    .search-container {
      position: relative;
      width: 100%;
      display: flex;
      gap: 8px;
    }
    .search-box {
      flex: 1;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent-blue);
    }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }
    .suggestion-item {
      padding: 10px 14px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      color: #c9d1d9;
    }
    .suggestion-item:active {
      background: #21262d;
      color: #fff;
    }

    /* Map Styling with Native Dark Filter */
    #map {
      width: 100%;
      height: 350px;
      border-radius: 12px;
      border: 1px solid var(--border);
      z-index: 1;
      background: #111;
    }
    .dark-tiles {
      filter: brightness(0.65) invert(1) contrast(2.5) hue-rotate(200deg) saturate(0.3) brightness(0.8);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-instruction {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }
    .nav-meta {
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .nav-meta b {
      color: var(--accent-green);
    }
    .row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button.secondary { background: #21262d; border: 1px solid var(--border); }
    button.start-nav {
      background: var(--accent-green);
      color: #000;
      font-size: 1rem;
    }
    button.stop-nav {
      background: #c62828;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Tripper Map</h1>
    <div id="statusBadge" class="status-badge">DISCONNECTED</div>
  </header>

  <div class="row">
    <button id="btnConnect" onclick="toggleConnection()">Connect BLE</button>
    <button class="secondary" onclick="centerOnUser()">My Location</button>
  </div>

  <!-- Search Input -->
  <div class="search-container">
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Search address or tap map..." autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>
    <button class="secondary" style="flex: 0 0 75px;" onclick="handleManualSearch()">Search</button>
  </div>

  <!-- High-Contrast Map -->
  <div id="map"></div>

  <!-- Route Actions -->
  <div class="row" id="navControlRow" style="display: none;">
    <button id="btnStartNav" class="start-nav" onclick="startNavigation()">Start Navigation</button>
    <button class="secondary" onclick="cancelRoute()">Clear</button>
  </div>

  <!-- Turn HUD -->
  <div class="card">
    <div class="nav-instruction" id="turnText">Search or tap destination on map</div>
    <div class="nav-meta">
      Next Turn: <b id="distText">-- m</b> | Remaining: <b id="remDistText">-- km</b>
    </div>
  </div>
</div>

<script>
  // ===========================================================
  // 1. BLUETOOTH ENGINE (Protected & Independent)
  // ===========================================================
  const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
  const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

  let bleDevice = null;
  let navCharacteristic = null;

  async function toggleConnection() {
    if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
      return;
    }

    try {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth not found. Open this page in the Bluefy app on iOS.");
        return;
      }

      bleDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', () => {
        const badge = document.getElementById("statusBadge");
        const btn = document.getElementById("btnConnect");
        badge.textContent = "DISCONNECTED";
        badge.classList.remove("connected");
        btn.textContent = "Connect BLE";
      });

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      navCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

      const badge = document.getElementById("statusBadge");
      const btn = document.getElementById("btnConnect");
      badge.textContent = "CONNECTED";
      badge.classList.add("connected");
      btn.textContent = "Disconnect";
    } catch (err) {
      console.error(err);
      alert("BLE Error: " + err.message);
    }
  }

  async function writeBLE(rawString) {
    if (!navCharacteristic) return;
    try {
      const encoder = new TextEncoder();
      await navCharacteristic.writeValue(encoder.encode(rawString));
    } catch (err) {
      console.warn("BLE Write error:", err);
    }
  }

  // ===========================================================
  // 2. MAP & NAVIGATION ENGINE
  // ===========================================================
  let map, userMarker, destMarker, routeLine;
  let userLat = null, userLon = null;
  let targetLat = null, targetLon = null, targetName = "Destination";

  let isNavigating = false;
  let routeSteps = [];
  let currentStepIdx = 0;
  let totalTripKm = 0;
  let searchDebounce = null;

  function initMap() {
    try {
      map = L.map('map', { zoomControl: false }).setView([19.0760, 72.8777], 13);

      // Official, 100% Free OpenStreetMap Tiles with Native Dark Dashboard Filter
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        className: 'dark-tiles',
        attribution: '© OpenStreetMap'
      }).addTo(map);

      map.on('click', function(e) {
        if (!userLat || !userLon) {
          alert("Waiting for phone GPS position...");
          return;
        }
        selectDestination(e.latlng.lat, e.latlng.lng, "Pinned Location");
      });

      setupSearch();
      startGpsTracking();
    } catch (e) {
      console.error("Map initialization failed:", e);
    }
  }

  function setupSearch() {
    const input = document.getElementById("searchInput");
    const list = document.getElementById("suggestions");

    input.addEventListener("input", () => {
      clearTimeout(searchDebounce);
      const query = input.value.trim();
      if (
