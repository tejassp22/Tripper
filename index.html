<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tripper Map Navigator</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #d80000;
      --accent-green: #00e676;
      --text: #ffffff;
      --text-dim: #888888;
      --border: #2d2d2d;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: #2a2a2a;
      color: var(--text-dim);
    }
    .status-badge.connected {
      background: #004d20;
      color: var(--accent-green);
    }
    #map {
      width: 100%;
      height: 320px;
      border-radius: 12px;
      border: 1px solid var(--border);
      z-index: 1;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-instruction {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .nav-meta {
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .nav-meta b {
      color: var(--accent-green);
    }
    .row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button.secondary { background: #2a2a2a; border: 1px solid var(--border); }
    .hint {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Tripper Map</h1>
    <div id="statusBadge" class="status-badge">DISCONNECTED</div>
  </header>

  <div class="row">
    <button id="btnConnect" onclick="toggleConnection()">Connect BLE</button>
    <button class="secondary" onclick="centerOnUser()">My Location</button>
  </div>

  <!-- Interactive Map -->
  <div id="map"></div>
  <div class="hint">Tap anywhere on the map to set a route destination</div>

  <!-- Active Turn HUD -->
  <div class="card">
    <div class="nav-instruction" id="turnText">No Active Route</div>
    <div class="nav-meta">
      Next Turn: <b id="distText">-- m</b> | Remaining: <b id="remDistText">-- km</b>
    </div>
  </div>
</div>

<script>
  const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
  const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

  let bleDevice = null;
  let navCharacteristic = null;

  let map, userMarker, destMarker, routeLine;
  let userLat = null, userLon = null;
  let routeSteps = [];
  let currentStepIdx = 0;
  let totalTripKm = 0;

  // Initialize Leaflet Map
  function initMap() {
    map = L.map('map').setView([19.0760, 72.8777], 14); // Default view

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Tap to set destination
    map.on('click', function(e) {
      if (!userLat || !userLon) {
        alert("Waiting for your phone's GPS position...");
        return;
      }
      setDestination(e.latlng.lat, e.latlng.lng);
    });

    startGpsTracking();
  }

  // -----------------------------------------------------------
  // Bluetooth Connection Handling
  // -----------------------------------------------------------
  async function toggleConnection() {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
      return;
    }

    try {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth not found. Open this in Bluefy on iOS.");
        return;
      }

      bleDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', () => {
        document.getElementById("statusBadge").textContent = "DISCONNECTED";
        document.getElementById("statusBadge").classList.remove("connected");
        document.getElementById("btnConnect").textContent = "Connect BLE";
      });

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      navCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

      document.getElementById("statusBadge").textContent = "CONNECTED";
      document.getElementById("statusBadge").classList.add("connected");
      document.getElementById("btnConnect").textContent = "Disconnect";
    } catch (err) {
      console.error(err);
      alert("BLE Error: " + err.message);
    }
  }

  async function writeBLE(rawString) {
    if (!navCharacteristic) return;
    try {
      const encoder = new TextEncoder();
      await navCharacteristic.writeValue(encoder.encode(rawString));
    } catch (err) {
      console.error("BLE Write error:", err);
    }
  }

  // -----------------------------------------------------------
  // GPS & Live Tracking
  // -----------------------------------------------------------
  function startGpsTracking() {
    if (!navigator.geolocation) return;

    navigator.geolocation.watchPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;

        if (!userMarker) {
          userMarker = L.circleMarker([userLat, userLon], {
            radius: 8,
            fillColor: "#007aff",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map);
          map.setView([userLat, userLon], 16);
        } else {
          userMarker.setLatLng([userLat, userLon]);
        }

        evaluateNavigation();
      },
      (err) => console.warn(err),
      { enableHighAccuracy: true, maximumAge: 1000 }
    );
  }

  function centerOnUser() {
    if (userLat && userLon) {
      map.setView([userLat, userLon], 16);
    }
  }

  // -----------------------------------------------------------
  // Routing with OpenStreetMap (OSRM)
  // -----------------------------------------------------------
  async function setDestination(lat, lon) {
    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.marker([lat, lon]).addTo(map);

    document.getElementById("turnText").textContent = "Calculating route...";

    // Query free OSRM Routing API with full turn steps
    const url = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${lon},${lat}?overview=full&geometries=geojson&steps=true`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      if (!data.routes || data.routes.length === 0) {
        alert("No drivable route found!");
        return;
      }

      const route = data.routes[0];
      totalTripKm = (route.distance / 1000.0).toFixed(1);
      routeSteps = route.legs[0].steps;
      currentStepIdx = 0;

      // Draw route line on map
      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.geoJSON(route.geometry, {
        style: { color: '#00e676', weight: 5, opacity: 0.8 }
      }).addTo(map);

      evaluateNavigation();
    } catch (err) {
      alert("Route calculation error: " + err.message);
    }
  }

  // -----------------------------------------------------------
  // Turn-by-Turn Logic & Tripper Mapping
  // -----------------------------------------------------------
  // Maps OSRM turn maneuvers to Tripper enum:
  // 0 = Straight, 1 = Left, 2 = Right, 3 = U-Turn, 4 = Roundabout
  function mapManeuverToTripper(maneuver) {
    const type = maneuver.type;
    const modifier = maneuver.modifier || "";

    if (type.includes("roundabout") || type.includes("rotary")) return 4;
    if (modifier.includes("left")) return 1;
    if (modifier.includes("right")) return 2;
    if (modifier.includes("u-turn")) return 3;
    return 0; // Default straight
  }

  function evaluateNavigation() {
    if (!routeSteps || routeSteps.length === 0 || currentStepIdx >= routeSteps.length) return;

    const step = routeSteps[currentStepIdx];
    const stepTargetCoord = step.maneuver.location; // [lon, lat]
    
    // Distance from user to the next turn maneuver point
    const distMeters = Math.round(getDistanceMeters(userLat, userLon, stepTargetCoord[1], stepTargetCoord[0]));

    // If within 25 meters of the turn point, advance to next maneuver
    if (distMeters < 25 && currentStepIdx < routeSteps.length - 1) {
      currentStepIdx++;
    }

    const activeStep = routeSteps[currentStepIdx];
    const turnType = mapManeuverToTripper(activeStep.maneuver);
    const roadName = activeStep.name || "Next Street";
    const initDist = Math.round(activeStep.distance) || distMeters;

    // Remaining total trip distance calculation
    let remDistMeters = distMeters;
    for (let i = currentStepIdx + 1; i < routeSteps.length; i++) {
      remDistMeters += routeSteps[i].distance;
    }
    const remKm = (remDistMeters / 1000.0).toFixed(1);

    // Update UI HUD
    document.getElementById("turnText").textContent = `${activeStep.maneuver.instruction || roadName}`;
    document.getElementById("distText").textContent = `${distMeters} m`;
    document.getElementById("remDistText").textContent = `${remKm} km`;

    // Construct Tripper protocol packet and stream via BLE
    const now = new Date();
    const payload = `NAV,${turnType},${distMeters},${initDist},${remKm},${totalTripKm},${now.getHours()},${now.getMinutes()},${roadName}\n`;
    writeBLE(payload);
  }

  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  window.onload = initMap;
</script>

</body>
</html>
